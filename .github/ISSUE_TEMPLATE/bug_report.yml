name: Bug report
description: Report something broken in Polaris
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include enough detail that someone else can reproduce it. For security issues, contact maintainers privately instead of filing here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: "Short description of the bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a clean or known state.
      placeholder: |
        1. Open project …
        2. Click …
        3. See error …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and approx commit / deploy if known.
      placeholder: "Chrome 128 · Windows 11 · commit abc1234"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console errors, network failures, or UI screenshots.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: This is not a security vulnerability (those stay private)
          required: true
